[package]
name = "ferros"
version = "0.0.0"
rust-version.workspace = true
edition = "2024"
description = "A Rust-native debugger with hybrid MIR and system-level introspection."
license = "Apache-2.0"
repository = "https://github.com/jamallyons/ferros"
documentation = "https://docs.rs/ferros"
readme = "./README.md"
keywords = ["debugger", "rust", "mir", "debugging"]
categories = ["development-tools"]

[dependencies]
clap = { version = "4.5.51", features = ["derive"] }

ferros-core = { path = "../ferros-core" }
ferros-utils = { path = "../ferros-utils" }

[target.'cfg(target_os = "macos")'.dependencies]
ferros-macos = { path = "../ferros-macos" }

# The workspace lints, copied because Cargo cannot inherit `workspace.lints` and
# override one entry. Keep in sync with the root Cargo.toml. The only difference:
# `cargo test` wrongly reports the dev-dependency `ctrlc` (used only by
# examples/test_target.rs) as unused, so `unused_dependencies` is allowed here.
[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
rust_2024_incompatible_pat = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -2 }
nursery = { level = "allow", priority = -1 }
cargo = { level = "warn", priority = -2 }
multiple_crate_versions = { level = "allow", priority = -1 }

[lints.cargo]
unused_dependencies = "allow"

[dev-dependencies]
ctrlc = "3.4"
