[package]
name = "ferros-tests"
version = "0.0.0"
rust-version.workspace = true
edition = "2024"
publish = false
description = "Integration test fixtures and test harness for Ferros."
license = "Apache-2.0"
repository = "https://github.com/jamallyons/ferros"
readme = "README.md"
keywords = ["debugger", "rust", "testing", "fixtures"]
categories = ["development-tools"]

# The macOS debugger. The crate keeps building on other OSes because the harness and
# symbol modules that use these are gated on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
ferros-core = { path = "../ferros-core" }
ferros-macos = { path = "../ferros-macos" }
# `symbols::function_address` reads fixture symbol tables (Mach-O, no DWARF).
object = { workspace = true }
rustc-demangle = "0.1"
# The `workqueue` fixture submits GCD work items without `unsafe`.
dispatch2 = { version = "0.3.0", default-features = false, features = ["std"] }

# Only the tests need the scripted mock backend. Keeping the feature here leaves it out
# of ordinary workspace builds, so the `ferros` binary is not built with the mock.
[dev-dependencies]
serde_json = "1.0"
# `tests/backend_mock.rs` writes synthetic DWARF line tables (the version ferros-core reads).
gimli = { version = "=0.32.3", default-features = false, features = ["write"] }
ferros-core = { path = "../ferros-core", features = ["test-util"] }
# `tests/lifecycle.rs` captures the backend's log of a failed hold on session drop.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

# `tests/repl_pty.rs` drives the interactive (rustyline) REPL through a pseudo-terminal.
# portable-pty opens the pty and makes it the child's controlling terminal (setsid and
# TIOCSCTTY) behind a safe API, since this crate forbids `unsafe`.
[target.'cfg(target_os = "macos")'.dev-dependencies]
portable-pty = "0.9.0"

# Fixture programs. `test = false`: they have no unit tests, so cargo should not build
# and run an empty test harness for each one.
[[bin]]
name = "ferros-fixture-hello"
path = "fixtures/hello.rs"
test = false

[[bin]]
name = "ferros-fixture-exit_code"
path = "fixtures/exit_code.rs"
test = false

[[bin]]
name = "ferros-fixture-loop_counter"
path = "fixtures/loop_counter.rs"
test = false

[[bin]]
name = "ferros-fixture-nested_calls"
path = "fixtures/nested_calls.rs"
test = false

[[bin]]
name = "ferros-fixture-threads"
path = "fixtures/threads.rs"
test = false

[lints]
workspace = true

