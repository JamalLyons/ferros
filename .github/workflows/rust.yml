name: Rust

on:
  push:
    branches: [ "master" ]
    paths:
      - '**.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/rust.yml'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - 'JustFile'
  pull_request:
    branches: [ "master" ]
    paths:
      - '**.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/rust.yml'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - 'JustFile'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Build
      run: cargo build --workspace --verbose

  macos:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v5
    - name: Install just
      run: brew install just
    - name: Format check
      run: just fmt-check
    - name: Lint
      run: just lint
    - name: Test
      run: just test
