[package]
name = "ferros"
version = "0.0.0"
rust-version.workspace = true
edition = "2024"
description = "A Rust-native debugger with hybrid MIR and system-level introspection."
license = "Apache-2.0"
repository = "https://github.com/jamallyons/ferros"
documentation = "https://docs.rs/ferros"
readme = "./README.md"
keywords = ["debugger", "rust", "mir", "debugging"]
categories = ["development-tools"]

[dependencies]
clap = { version = "4.5.51", features = ["derive"] }

ferros-core = { path = "../ferros-core" }
ferros-utils = { path = "../ferros-utils" }
rustyline = "17"
ctrlc = "3.4"

[target.'cfg(target_os = "macos")'.dependencies]
ferros-macos = { path = "../ferros-macos" }

[lints]
workspace = true

# The REPL unit tests drive the scripted mock backend. Only the tests enable the
# feature, so the binary itself is never built with the mock.
[dev-dependencies]
ferros-core = { path = "../ferros-core", features = ["test-util"] }
