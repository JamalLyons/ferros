[package]
name = "ferros-tests"
version = "0.0.0"
edition = "2024"
publish = false
description = "Integration test fixtures and test harness for Ferros."
license = "Apache-2.0"
repository = "https://github.com/jamallyons/ferros"
readme = "README.md"
keywords = ["debugger", "rust", "testing", "fixtures"]
categories = ["development-tools"]

[dependencies]
ferros-core = { path = "../ferros-core" }

# The macOS debugger. The crate keeps building on other OSes because the harness that
# uses it is gated on macOS.
[target.'cfg(target_os = "macos")'.dependencies]
ferros-macos = { path = "../ferros-macos" }
# `symbols::function_address` reads fixture symbol tables (Mach-O, no DWARF).
object = { version = "0.38.0", features = ["read", "macho"] }
rustc-demangle = "0.1"
# The `workqueue` fixture submits GCD work items without `unsafe`.
dispatch2 = { version = "0.3.0", default-features = false, features = ["std"] }

# Only the tests need the scripted mock backend. Keeping the feature here leaves it out
# of ordinary workspace builds, so the `ferros` binary is not built with the mock.
[dev-dependencies]
serde_json = "1.0"
ferros-core = { path = "../ferros-core", features = ["test-util"] }

# Fixture programs. `test = false`: they have no unit tests, so cargo should not build
# and run an empty test harness for each one.
[[bin]]
name = "ferros-fixture-hello"
path = "fixtures/hello.rs"
test = false

[[bin]]
name = "ferros-fixture-exit_code"
path = "fixtures/exit_code.rs"
test = false

[[bin]]
name = "ferros-fixture-loop_counter"
path = "fixtures/loop_counter.rs"
test = false

[[bin]]
name = "ferros-fixture-nested_calls"
path = "fixtures/nested_calls.rs"
test = false

[[bin]]
name = "ferros-fixture-threads"
path = "fixtures/threads.rs"
test = false

[lints]
workspace = true

[[bin]]
name = "ferros-fixture-signal_handler"
path = "fixtures/signal_handler.rs"
test = false

[[bin]]
name = "ferros-fixture-signal_tracing"
path = "fixtures/signal_tracing.rs"
test = false

[[bin]]
name = "ferros-fixture-thread_signals"
path = "fixtures/thread_signals.rs"
test = false

[[bin]]
name = "ferros-fixture-spawn_thread"
path = "fixtures/spawn_thread.rs"
test = false

[[bin]]
name = "ferros-fixture-workqueue"
path = "fixtures/workqueue.rs"
test = false
