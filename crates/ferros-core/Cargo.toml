[package]
name = "ferros-core"
version = "0.0.0"
edition = "2024"
description = "Low-level debugging primitives and process control for Ferros."
license = "Apache-2.0"
repository = "https://github.com/jamallyons/ferros"
readme = "README.md"
keywords = ["debugger", "rust", "debugging", "ptrace"]
categories = ["development-tools"]

[dependencies]
addr2line = "0.25.1"
gimli = "=0.32.3"
object = { version = "0.38.0", features = ["read", "macho"] }
once_cell = "1.19"
rustc-demangle = "0.1"
smallvec = "1.13"
libc = "0.2.177"
thiserror = { workspace = true }
tracing = { workspace = true }

# macOS-specific Mach API bindings
[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14"
mach2 = "0.6.0"

[build-dependencies]
rustc_version = "0.4"

# ferros-core calls Mach APIs through raw FFI, so it needs `unsafe`, which the
# workspace lints forbid. Mirror the workspace lints minus `unsafe_code = "forbid"`
# and minus clippy pedantic (to avoid churn in ferros-core; revisit later).
[lints.rust]
unused = { level = "warn", priority = -1 }
rust_2024_incompatible_pat = "warn"

[lints.clippy]
cargo = { level = "warn", priority = -2 }
nursery = { level = "allow", priority = -1 }
multiple_crate_versions = { level = "allow", priority = -1 }
