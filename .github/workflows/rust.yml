name: Rust

on:
  push:
    branches: [ "trunk" ]
    paths:
      - '**.rs'
      # Native fixture sources that crates/ferros-tests/build.rs compiles.
      - 'crates/ferros-tests/fixtures/**.c'
      - 'crates/ferros-tests/fixtures/**.s'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/rust.yml'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - 'JustFile'
      - '.cargo/**'
      - 'scripts/**'
      - '**/*.entitlements'
      # Agent and decision docs: a change to the rules should run the checks that enforce them.
      - '**/AGENTS.md'
      - 'docs/adr/**'
  pull_request:
    branches: [ "trunk" ]
    paths:
      - '**.rs'
      # Native fixture sources that crates/ferros-tests/build.rs compiles.
      - 'crates/ferros-tests/fixtures/**.c'
      - 'crates/ferros-tests/fixtures/**.s'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - '.github/workflows/rust.yml'
      - 'rust-toolchain.toml'
      - 'rustfmt.toml'
      - 'JustFile'
      - '.cargo/**'
      - 'scripts/**'
      - '**/*.entitlements'
      # Agent and decision docs: a change to the rules should run the checks that enforce them.
      - '**/AGENTS.md'
      - 'docs/adr/**'

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Check platform boundary
      run: sh scripts/check-boundary.sh
    - name: Build
      run: cargo build --workspace --verbose
    # ferros-core holds no OS-specific code, so its tests must pass off macOS.
    - name: Test ferros-core
      run: cargo test -p ferros-core --all-features

  macos:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v5
    - name: Install just
      run: brew install just
    - name: Install nightly rustfmt
      run: rustup toolchain install nightly --profile minimal --component rustfmt
    - name: Format check
      run: just fmt-check
    - name: Lint
      run: just lint
    # Local runs and the other jobs build only arm64, so nothing else compiles the
    # x86_64 register code. Clippy denies warnings, as `just lint` does.
    - name: Lint ferros-macos for x86_64-apple-darwin
      run: |
        rustup target add x86_64-apple-darwin
        cargo clippy -p ferros-macos --target x86_64-apple-darwin --all-targets -- -D warnings
    - name: Check platform boundary
      run: just check-boundary
    - name: Test
      run: just test

  integration-macos:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v5
    - name: Install just
      run: brew install just
    - name: Debugging permission status
      run: |
        DevToolsSecurity -status || true
        id -Gn || true
        sw_vers -productVersion || true
        uname -m || true
        security authorizationdb read system.privilege.taskport 2>/dev/null | grep -A1 -E '<key>(class|group|rule|authenticate-user)</key>' || true
    # The hosted runner has developer mode enabled and its user is in _developer, yet a signed
    # debugger still blocks in task_for_pid there: macOS waits for a "Developer Tools Access"
    # authorization that nobody can give on a machine without a person at the screen. This
    # machine setup removes that prompt. The tests themselves still run as the normal runner
    # user, without sudo.
    - name: Allow task_for_pid without a dialog (runner setup)
      run: sudo security authorizationdb write system.privilege.taskport allow
    - name: Integration tests
      run: just test-integration
    # `measure_mapped_uuid_and_backtrace_cost` writes the before/after #170 timings here.
    # libtest swallows the test's own output when it passes, so print the file explicitly.
    - name: Mapped UUID measurement
      if: always()
      run: |
        file=target/ferros-uuid-measure.txt
        if [ -f "$file" ]; then
          echo "Mapped UUID measurement (#182):"
          cat "$file"
        else
          echo "mapped UUID measurement file is missing" >&2
          exit 1
        fi
    - name: Authorization log
      if: always()
      run: |
        log show --last 3m --style compact --predicate 'process == "taskgated" OR process == "taskgated-helper" OR process == "authd" OR process == "SecurityAgent"' | tail -n 40 || true
    - name: No fixture process left behind
      if: always()
      run: |
        if leaked=$(pgrep -fl ferros-fixture-); then
          echo "Found leaked fixture processes:" >&2
          printf '%s\n' "$leaked" >&2
          exit 1
        fi
