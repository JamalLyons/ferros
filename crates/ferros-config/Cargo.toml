[package]
name = "ferros-config"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Ferros Contributors"]
description = "Configuration loading and management for the Ferros debugger."
repository = "https://github.com/jamallyons/ferros"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.9.8"
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"
