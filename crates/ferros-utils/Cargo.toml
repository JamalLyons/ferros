[package]
name = "ferros-utils"
version = "0.0.0"
rust-version.workspace = true
edition = "2024"
description = "Shared utilities, logging, config, and helpers for Ferros."
license = "Apache-2.0"
repository = "https://github.com/jamallyons/ferros"
readme = "README.md"
keywords = ["debugger", "rust", "utilities", "logging"]
categories = ["development-tools"]
publish = false

[features]
# Enabled by the CLI's dev-dependency for the process-exit regression test.
test-log-write-delay = []

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "ansi", "registry", "chrono"] }
tracing-appender = "0.2"
tracing-log = { version = "0.2", default-features = false, features = ["log-tracer", "std"] }
chrono = "0.4.42"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Allow multiple crate versions (needed for tracing-appender which uses thiserror 1.0)
# Use priority 0 to override the default deny from -D warnings
multiple_crate_versions = { level = "allow", priority = 0 }

# Cargo lints (Rust 1.100+): fail on dependencies no target uses.
[lints.cargo]
unused_dependencies = "deny"
