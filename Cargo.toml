[workspace]
members = [
    "crates/ferros",
    "crates/ferros-core",
    "crates/ferros-mir",
    "crates/ferros-protocol",
    "crates/ferros-tests",
    "crates/ferros-utils",
]
exclude = ["crates/ferros-ui"]
resolver = "2"

[profile.dev.package.ferros-tests]
opt-level = 0
debug = "full"
split-debuginfo = "packed"

[workspace.lints.rust]
unsafe_code = "forbid"
# missing_docs = "warn"
unused = { level = "warn", priority = -1 }
# Warn about Rust 2024 incompatible patterns
rust_2024_incompatible_pat = "warn"

# Clippy lints
[workspace.lints.clippy]
# Enforce pedantic clippy lints (set priority to avoid conflicts)
pedantic = { level = "warn", priority = -2 }
# Allow nursery lints (experimental)
nursery = { level = "allow", priority = -1 }
# Cargo-related lints
cargo = { level = "warn", priority = -2 }
# Allow multiple crate versions (transitive dependencies)
multiple_crate_versions = { level = "allow", priority = -1 }

# Workspace dependencies
[workspace.dependencies]
thiserror = "2.0.17"
tracing = "0.1"
