[package]
name = "ferros-core"
version = "0.0.0"
edition = "2024"
description = "Low-level debugging primitives and process control for Ferros."
license = "Apache-2.0"
repository = "https://github.com/jamallyons/ferros"
readme = "README.md"
keywords = ["debugger", "rust", "debugging", "ptrace"]
categories = ["development-tools"]

[features]
# Enables `backend::mock` (an in-memory, scripted `Backend`) for tests in dependent crates.
test-util = []

[dependencies]
addr2line = "0.25.1"
gimli = "=0.32.3"
object = { version = "0.38.0", features = ["read", "macho"] }
once_cell = "1.19"
rustc-demangle = "0.1"
smallvec = "1.13"
thiserror = { workspace = true }
tracing = { workspace = true }

[build-dependencies]
rustc_version = "0.4"

# ferros-core holds no OS-specific code and no `unsafe` (the Mach FFI lives in
# ferros-macos). Mirror the workspace lints minus clippy pedantic (to avoid churn
# in ferros-core; revisit later).
[lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }
rust_2024_incompatible_pat = "warn"

[lints.clippy]
cargo = { level = "warn", priority = -2 }
nursery = { level = "allow", priority = -1 }
multiple_crate_versions = { level = "allow", priority = -1 }
